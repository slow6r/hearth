# hearthd — reference configuration.
#
# ЭТО ЭТАЛОН, А НЕ КОНФИГ УЗЛА. Файл используется как фикстура в тестах
# (config::tests::reference), поэтому боевые значения сюда попадать не должны:
# реальный отпечаток админа в allowed_admin_fingerprints ломает тесты авторизации,
# а удалённая секция [backup.remote] — тест валидации адреса бэкапа.
# Значения развёрнутого узла fels перечислены в docs/deploy-fels-2026-09-09.md.
#
# Deployed to /etc/hearth/hearthd.toml (root:hearth 0640).
# Every value is checked by Config::validate() at start-up; unknown keys are a hard
# error on purpose (a typo in a security key must not silently default).
#
# DEPLOYMENT MODEL: the relays are reachable from the internet, exactly like any other
# SimpleX server. Message content is end-to-end encrypted and the relay CA fingerprint
# is pinned inside every client address, so a public relay is upstream's normal mode.
# What stays private to the LAN: this control plane, its admin API, and ssh.

[node]
name = "hearth-node"
# ==> SET THIS. The public hostname (or IP) clients connect to. It goes into every
# client address, so it outlives the hardware — changing it means every family member
# re-adds every contact (docs/runbook-rotate-address.md).
# A hostname with dynamic DNS is usually right for a home connection; a bare IP works
# only if your ISP address is static.
host = "relay.example.org"
# Networks hearthd ITSELF may connect to (backup target, alert channel). The relays
# serve the internet; the control plane never leaves the LAN. Adjust to your LAN.
lan_networks = ["192.168.1.0/24"]
# Who may reach the admin API and ssh. Must be inside lan_networks.
admin_networks = ["192.168.1.0/24"]

[api]
# Admin API: LAN address only, never a wildcard bind. Config::validate refuses both.
listen = "192.168.1.10:7443"
pki_dir = "/etc/hearth/pki"
allowed_admin_fingerprints = []
max_body_bytes = 65536

[paths]
simplex_etc = "/etc/opt/simplex"
simplex_var = "/var/opt/simplex"
hearth_etc = "/etc/hearth"
state_dir = "/var/lib/hearth"
secrets_dir = "/etc/hearth/secrets"
manifest = "/etc/hearth/manifest.toml"

# ---------------------------------------------------------------------------
# Relays — stock upstream binaries. hearthd supervises them, never edits their data.
#
# Upstream documents `[TRANSPORT] host` as "only used to print server address on
# start": the server listens on every interface. So only ports are configured here,
# and address filtering is the firewall's job.
# ---------------------------------------------------------------------------

[smp]
enabled = true
unit = "smp-server.service"
scheme = "smp"
port = 5223
# Upstream's own default is "5223,443". Port 443 is what gets through hotel wifi and
# restrictive mobile networks — keep it unless something else needs 443 on this host.
extra_ports = [443]
control = "127.0.0.1:5224"
config_file = "/etc/opt/simplex/smp-server.ini"
fingerprint_file = "/etc/opt/simplex/fingerprint"
password_file = "/etc/hearth/secrets/smp-create-password"
process = "smp-server"

[xftp]
enabled = true
unit = "xftp-server.service"
scheme = "xftp"
port = 5443
extra_ports = []
control = "127.0.0.1:5444"
config_file = "/etc/opt/simplex-xftp/file-server.ini"
fingerprint_file = "/etc/opt/simplex-xftp/fingerprint"
password_file = "/etc/hearth/secrets/xftp-create-password"
process = "xftp-server"

[turn]
# Voice and video calls. When both parties are behind NAT — two phones on mobile
# networks, i.e. the normal case — TURN is the only way a media path exists at all,
# so this must be reachable from the internet.
enabled = true
unit = "coturn.service"
port = 3478
# TURN over TLS. Without it, calls fail on networks that permit only 443/tcp.
#
# Enabling it is NOT one switch — it takes four coordinated changes, and Config::validate
# refuses a half-configuration rather than letting coturn start with no TLS listener:
#   1. tls_port + tls_cert + tls_key here (all three, or none);
#   2. open the port in deploy/nftables/hearth.nft (relay_ports set);
#   3. allow coturn's outbound TCP relay there too — `turns:...?transport=tcp`
#      allocations use TCP, and the current rule permits UDP only;
#   4. get and renew the certificate for node.host (certbot needs outbound access;
#      root already has it via app_egress).
# 5349 is conventional; 443 would collide with smp extra_ports above.
# tls_port = 5349
# tls_cert = "/etc/letsencrypt/live/relay.example.org/fullchain.pem"
# tls_key  = "/etc/letsencrypt/live/relay.example.org/privkey.pem"
relay_min_port = 49160
relay_max_port = 49200
realm = "hearth"
secret_file = "/etc/hearth/secrets/turn-secret"
config_template = "/etc/hearth/templates/turnserver.conf.tmpl"
# Не /etc/turnserver.conf: запись атомарная (временный файл + rename), а под
# ProtectSystem=strict каталог /etc read-only — ротация падала с EROFS. Каталог
# setgid turnserver, чтобы coturn (User=turnserver) смог прочитать отрендеренное.
config_file = "/etc/hearth/turn/turnserver.conf"
# Credential lifetime. Bundles are issued once per device, so a short TTL means calls
# stop working a day later while messages keep flowing — confusing. Match it to the
# secret rotation period instead.
credential_ttl_secs = 2592000
rotate_days = 30

# ---------------------------------------------------------------------------
# hearthd modules
# ---------------------------------------------------------------------------

[supervisor]
check_interval_secs = 15
probe_timeout_secs = 3
restart_backoff_secs = [5, 15, 60, 300]
restart_alert_threshold = 3
restart_window_secs = 600
restart_enabled = true

[egress]
# The relays accept connections from the internet; this watches the OTHER direction —
# anything on this host trying to reach out. Expected value over 24h is still 0.
poll_interval_secs = 30
socket_scan_interval_secs = 300
nft_family = "inet"
nft_table = "hearth"
egress_counter = "egress_drop"
input_counter = "input_drop"
journal_prefix = "hearth-egress-drop"
# Релейный стек: эти процессы не должны САМИ инициировать соединения наружу.
# turnserver сюда не входит — он ретранслирует медиа звонков по назначению.
relay_processes = ["smp-server", "xftp-server"]
# Счётчики разрешённого egress: показываются, но инцидентом не считаются.
informational_counters = ["app_egress", "turn_egress"]

[integrity]
interval_secs = 3600
stop_relays_on_mismatch = true

[backup]
enabled = true
hour_utc = 3
paths = [
    "/etc/opt/simplex",
    "/etc/opt/simplex-xftp",
    "/var/opt/simplex",
    "/etc/hearth",
    "/var/lib/hearth",
]
spool_dir = "/var/opt/hearth/backup"
# ==> SET THIS. Public age key of the owner. The PRIVATE key never touches this
# machine (YubiKey / offline copy). See keys/README.md.
recipients = [
    "age1qqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqsyfhqz",
]
retention_days = 14

[backup.remote]
host = "192.168.1.20"
port = 22
user = "hearth-backup"
path = "/srv/hearth-backup"
ssh_key = "/etc/hearth/secrets/backup_ed25519"

[alerts]
[alerts.gotify]
addr = "192.168.1.1:8088"
token_file = "/etc/hearth/secrets/gotify-token"
priority = 8
min_severity = "warning"

[alerts.beeper]
command = ["/usr/local/sbin/hearth-beep"]
min_severity = "critical"

[devices]
# ТЗ §1.1 говорит «≤ 20 устройств» — это писалось, когда предполагалось одно
# устройство на человека. 20 человек — это 40–60 устройств.
max_devices = 50
