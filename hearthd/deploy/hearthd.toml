# hearthd — reference configuration.
#
# Deployed to /etc/hearth/hearthd.toml (root:hearth 0640).
# Every value here is checked by Config::validate() at start-up; unknown keys are a
# hard error on purpose (a typo in a security key must not silently default).
#
# ТЗ references are given per section.

[node]
name = "hearth-node"
# ТЗ §2.5: this address outlives the hardware. It does not change on the ПК → mini-PC move.
address = "10.66.10.10"
# ТЗ §5.1 — home + WireGuard space. hearthd refuses to open a socket outside this.
home_networks = ["10.66.0.0/16"]
# ТЗ §5.3 — only this subnet may reach the admin API.
admin_networks = ["10.66.0.0/24"]

[api]
# ТЗ §7.3 — mTLS admin API, reachable from the admin subnet only.
listen = "10.66.10.10:7443"
pki_dir = "/etc/hearth/pki"
# Optional extra pinning on top of admins.json. Empty = any non-revoked issued cert.
allowed_admin_fingerprints = []
max_body_bytes = 65536

[paths]
# ТЗ §10.1 — everything the node owns lives in these directories.
simplex_etc = "/etc/opt/simplex"
simplex_var = "/var/opt/simplex"
hearth_etc = "/etc/hearth"
state_dir = "/var/lib/hearth"
secrets_dir = "/etc/hearth/secrets"
manifest = "/etc/hearth/manifest.toml"

# ---------------------------------------------------------------------------
# Relays — stock upstream binaries. hearthd supervises them and never edits data.
# ---------------------------------------------------------------------------

[smp]
enabled = true
unit = "smp-server.service"
scheme = "smp"
listen = "10.66.10.10:5223"
control = "127.0.0.1:5224"
config_file = "/etc/opt/simplex/smp-server.ini"
fingerprint_file = "/etc/opt/simplex/fingerprint"
password_file = "/etc/hearth/secrets/smp-create-password"
process = "smp-server"

[xftp]
enabled = true
unit = "xftp-server.service"
scheme = "xftp"
listen = "10.66.10.10:5443"
control = "127.0.0.1:5444"
config_file = "/etc/opt/simplex-xftp/file-server.ini"
fingerprint_file = "/etc/opt/simplex-xftp/fingerprint"
password_file = "/etc/hearth/secrets/xftp-create-password"
process = "xftp-server"

[turn]
# ТЗ §6.4 — coturn with a rotating static secret; no public STUN/TURN anywhere.
enabled = true
unit = "coturn.service"
listen = "10.66.10.10:3478"
realm = "hearth"
username = "hearth"
secret_file = "/etc/hearth/secrets/turn-secret"
config_template = "/etc/hearth/templates/turnserver.conf.tmpl"
config_file = "/etc/turnserver.conf"
credential_ttl_secs = 86400
rotate_days = 30

# ---------------------------------------------------------------------------
# hearthd modules (ТЗ §7.3)
# ---------------------------------------------------------------------------

[supervisor]
check_interval_secs = 15
probe_timeout_secs = 3
restart_backoff_secs = [5, 15, 60, 300]
restart_alert_threshold = 3
restart_window_secs = 600
restart_enabled = true

[egress]
# ТЗ §5.4 / §7.3 — the leak detector. Expected value of egress_drop over 24h is 0.
poll_interval_secs = 30
socket_scan_interval_secs = 300
nft_family = "inet"
nft_table = "hearth"
egress_counter = "egress_drop"
input_counter = "input_drop"
journal_prefix = "hearth-egress-drop"
watch_processes = ["smp-server", "xftp-server", "turnserver"]

[integrity]
# ТЗ §7.3 / A12 — sha256 of every pinned binary against manifest.toml.
interval_secs = 3600
stop_relays_on_mismatch = true

[backup]
# ТЗ §7.3 — daily age-encrypted archive pushed to hearth-backup.
enabled = true
hour_utc = 3
paths = [
    "/etc/opt/simplex",
    "/etc/opt/simplex-xftp",
    "/var/opt/simplex",
    "/etc/hearth",
    "/var/lib/hearth",
]
spool_dir = "/var/opt/hearth/backup"
# Public age keys of the owner(s). The PRIVATE key never touches this machine
# (ТЗ §7.3: YubiKey / offline). Replace with real recipients before deployment.
recipients = [
    "age1qqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqsyfhqz",
]
retention_days = 14

[backup.remote]
host = "10.66.10.20"
port = 22
user = "hearth-backup"
path = "/srv/hearth-backup"
ssh_key = "/etc/hearth/secrets/backup_ed25519"

[alerts]
# ТЗ §7.3 — journal + WG-only Gotify on the UDM Pro. External channels are forbidden.
[alerts.gotify]
addr = "10.66.0.1:8088"
token_file = "/etc/hearth/secrets/gotify-token"
priority = 8
min_severity = "warning"

[alerts.beeper]
command = ["/usr/local/sbin/hearth-beep"]
min_severity = "critical"

[devices]
# ТЗ §1.1 — a closed circle, at most 20 devices.
max_devices = 20
