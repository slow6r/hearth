# Drop-in для prometheus-node-exporter:
#   /etc/systemd/system/prometheus-node-exporter.service.d/hearth.conf
#
# Включает textfile-коллектор, через который приходят метрики smp/xftp-серверов
# (симлинки на *-metrics.txt, см. README.md), и биндит экспортер на loopback —
# наружу ему торчать незачем, Prometheus живёт на этой же машине.

[Service]
ExecStart=
ExecStart=/usr/bin/prometheus-node-exporter \
    --web.listen-address=127.0.0.1:9100 \
    --collector.textfile.directory=/var/lib/node_exporter/textfile \
    --collector.systemd \
    --collector.hwmon

# Читать метрики релеев, которые пишутся от пользователя simplex.
SupplementaryGroups=simplex
