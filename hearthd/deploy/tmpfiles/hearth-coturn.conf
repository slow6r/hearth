# coturn пишет сюда pid-файл, а юнит объявляет /run/coturn в ReadWritePaths.
# Пакет Debian каталог не создаёт: systemd не может смонтировать ReadWritePaths на
# несуществующий путь и падает на шаге NAMESPACE (status=226) ещё до запуска turnserver.
# /run — tmpfs, так что каталог обязан пересоздаваться при каждой загрузке.
d /run/coturn 0755 turnserver turnserver -
d /var/log/coturn 0750 turnserver turnserver -
