# Drop-in для релейных юнитов: /etc/systemd/system/<unit>.d/hearth-mode.conf
#
# ЗАЧЕМ. Решение «можно ли запускать релей» принимает не только hearthd. Релейные
# юниты стоят в multi-user.target и стартуют при каждой загрузке — параллельно с
# демоном и задолго до того, как он прочитал node-mode.json. Без этой строки карантин
# снимался первой же перезагрузкой, а домашний узел перезагружается от любого сбоя
# питания: подменённый бинарь возвращался в строй сам. ADR 0013 обещает запрет,
# который «переживает перезагрузку машины»; поставляемые юниты этого не делали.
#
# ПОЧЕМУ ExecCondition, А НЕ ExecStartPre. При неуспехе ExecCondition systemd помечает
# юнит ПРОПУЩЕННЫМ, а ExecStartPre — упавшим. Упавший юнит запускает Restart=on-failure,
# крутится в рестартах и выглядит для надзора как HealthState::Down — то есть работающий
# по назначению запрет превращается в поток алертов и в мигающий красным узел.
#
# ПОЧЕМУ ПРЕФИКС «+». Он снимает с этой одной команды User=/Group= и песочницу юнита.
# /var/lib/hearth развёрнут 0750 hearth:hearth (install.sh), а релеи работают под
# simplex и simplex-ntf. Без «+» гейт упирался бы в EACCES, считал файл непрочитанным
# и запрещал старт ВСЕГДА — узел не поднялся бы и после обычной перезагрузки.
#
# ПУТЬ ЗДЕСЬ НЕ ЗАШИТ. Гейт берёт файл режима из paths.state_dir в hearthd.toml — там
# же, куда его пишет демон. Зашитый путь разъезжался с боевой конфигурацией МОЛЧА:
# гейт не находил файла, считал узел обычным и разрешал старт релея в карантине. Из
# конфигурации читается ровно одно поле (`paths.state_dir`), поэтому опечатка в
# постороннем разделе гейту безразлична; если не читается и оно — старт запрещён
# (fail-closed), причина уходит в journal.
#
# ЕСЛИ РЕЛЕИ НЕ ПОДНИМАЮТСЯ. Запрет снимается на самом узле, с правами root, без
# работающего hearthd и без админского сертификата:
#     sudo hearthctl mode gate ; echo $?        # 1 — запрет, причина в journalctl
#     sudo hearthctl mode clear --local         # снять запрет прямо здесь
# Когда сломана и конфигурация, файл указывают явно:
#     sudo hearthctl mode clear --local --file /var/lib/hearth/node-mode.json
# Подробности и крайний случай — docs/runbook-node-mode.md.
#
# ЕСЛИ hearthctl ПРОПАЛ ИЛИ НЕ ИСПОЛНЯЕТСЯ. systemd отвечает на такой ExecCondition
# кодом 203, а 203 лежит в диапазоне «условие не выполнено» — юнит помечается
# ПРОПУЩЕННЫМ, и в журнале НЕТ ни одной строки `hearth:`. Отличить это от честного
# запрета можно ровно так: `Skipped due to 'exec-condition'` без строки `hearth:`.
# Проверка — `ls -l /usr/local/bin/hearthctl` и `hearthctl mode gate ; echo $?`.
# Подробности — docs/runbook-node-mode.md §4 и docs/acceptance-tests.md, раздел A15.
#
# Требуется systemd 243+ (ExecCondition). На Debian 12 — 252.
[Unit]
# Каталог состояния может лежать на отдельном разделе (deploy/systemd/var-opt-*.mount).
# Без этой строки юнит релея стартует ДО монтирования, гейт не находит файла режима на
# ещё не смонтированном разделе, считает узел обычным и МОЛЧА разрешает старт в
# карантине — тот самый fail-open, ради которого путь стали брать из конфигурации.
# Путь здесь поставочный; install.sh дописывает сюда реальный paths.state_dir, если он
# на узле другой.
RequiresMountsFor=/var/lib/hearth

[Service]
# ПУТЬ К КОНФИГУРАЦИИ — ЯВНО. ExecCondition наследует окружение юнита, а hearthctl
# понимает переменную HEARTHD_CONFIG. Заданная в юните релея или в /etc/default, она
# молча увела бы гейт на чужую конфигурацию, а значит — на чужой файл режима: снаружи
# это выглядит как карантин, снявшийся сам собой. Флаг в командной строке сильнее
# переменной, а сам hearthctl её для гейта и не читает (см. config_for_local_decision).
# Строка ниже отменяет переменную и для остальных команд этого юнита, если она там есть.
UnsetEnvironment=HEARTHD_CONFIG
ExecCondition=+/usr/local/bin/hearthctl --config /etc/hearth/hearthd.toml mode gate
