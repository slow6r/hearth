# Drop-in for the distro coturn unit: /etc/systemd/system/coturn.service.d/hearth.conf
#
# The Debian package ships a unit that reads /etc/turnserver.conf, which hearthd
# rewrites on every secret rotation. This only tightens the sandbox and makes the
# dependency on nftables explicit.
[Unit]
After=nftables.service
Requires=nftables.service

[Service]
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
ReadWritePaths=/var/log/coturn /run/coturn
