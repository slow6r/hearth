# Drop-in for the distro coturn unit: /etc/systemd/system/coturn.service.d/hearth.conf
#
# Two jobs: point coturn at the config hearthd renders, and tighten the sandbox.
#
# WHY THE CONFIG MOVED OUT OF /etc/turnserver.conf.
# hearthd rewrites the config on every secret rotation, and every write it makes is
# atomic — temp file next to the target, then rename. That needs write permission on
# the DIRECTORY. hearthd runs under ProtectSystem=strict, where /etc is read-only, so
# rendering into /etc/ failed with EROFS on `/etc/turnserver.conf.tmp.<pid>`.
#
# /etc/hearth/turn is the answer: hearthd already has it read-write, and the directory
# is setgid `turnserver` so the rendered file lands as hearth:turnserver 0640 — writable
# by the daemon that renders it, readable by the daemon that needs it, and by nobody
# else. It holds static-auth-secret, so that distinction matters.
[Unit]
After=nftables.service
Requires=nftables.service

[Service]
ExecStart=
ExecStart=/usr/bin/turnserver -c /etc/hearth/turn/turnserver.conf --pidfile=
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
ReadWritePaths=/var/log/coturn /run/coturn
# ProtectSystem=strict would otherwise hide nothing but make everything read-only —
# which is fine here, coturn only reads its config. Named explicitly so that a future
# ProtectSystem=full or a ReadOnlyPaths tightening does not silently cut it off.
ReadOnlyPaths=/etc/hearth/turn
