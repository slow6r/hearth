#!/usr/sbin/nft -f
#
# hearth node (fels).
#
# NO `flush ruleset` HERE. Docker keeps its own `ip nat` and `ip filter` tables through
# iptables-nft; flushing the whole ruleset would delete them, and mongo, redis and the
# you-can-do.ru site would lose the network with nothing in any log to explain it.
# Docker does not re-create those rules on its own.
#
# So only our own table is replaced. The `table` line before `delete` is the idiom that
# makes the delete idempotent: it creates the table if it is not there yet.

table inet hearth
delete table inet hearth

include "/etc/hearth/nftables/hearth.nft"
