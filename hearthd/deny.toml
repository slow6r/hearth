# cargo-deny — supply chain policy for hearthd (ТЗ §7.2).
#
#   cargo install cargo-deny && cargo deny check
#
# The node runs code nobody here wrote except this crate. Every transitive dependency
# is part of the trusted computing base of a family's private messenger, so the bar is:
# known licence, no advisory, no duplicate versions drifting in silently.

[graph]
targets = [
    { triple = "x86_64-unknown-linux-musl" },
    { triple = "x86_64-unknown-linux-gnu" },
]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# Permissive licences only; hearthd itself is AGPL-3.0-or-later, matching upstream.
allow = [
    "AGPL-3.0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Nothing here may pull in a general-purpose HTTP client or a TLS stack we did not
# choose: an outbound client crate is exactly the capability this node must not have
# (ТЗ §7.2, §7.4).
deny = [
    { name = "reqwest" },
    { name = "ureq" },
    { name = "curl" },
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "native-tls" },
    { name = "hyper-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
